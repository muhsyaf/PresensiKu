<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PresensiKu Kamera</title>
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>body{font:16px system-ui;background:#f3f5fa;color:#172033;margin:0}.wrap{max-width:720px;margin:24px auto;padding:16px}.card{background:white;border:1px solid #dfe4ee;border-radius:16px;padding:20px}video{width:100%;max-height:440px;background:#111;border-radius:12px;transform:scaleX(-1)}button{padding:12px 18px;border:0;border-radius:9px;background:#3157d5;color:white;font-weight:600;margin:8px 6px 8px 0}.status{padding:12px;border-radius:9px;background:#edf1fa;margin:12px 0}.error{background:#fff0f0;color:#b42323}.ok{background:#e9f7ef;color:#167345}.small{font-size:13px;color:#667085}</style></head>
<body><div class="wrap"><div class="card"><h2>PresensiKu — Verifikasi Wajah</h2><p class="small">Buka melalui tombol aplikasi utama. Izinkan akses kamera.</p><video id="video" autoplay muted playsinline></video><div><button id="start" onclick="start()">Aktifkan kamera dan mulai</button><button onclick="stop()">Matikan kamera</button></div><div id="status" class="status">Menunggu kamera.</div><p class="small">Liveness dasar: dua kedipan dan gerakan kepala kiri/kanan. Bukan anti-spoofing tersertifikasi.</p></div></div>
<script>
const MODEL='https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';let stream=null,ready=false,busy=false;
function say(t,c=''){let e=document.getElementById('status');e.textContent=t;e.className='status '+c}
function send(p){if(window.opener&&!window.opener.closed)window.opener.postMessage(Object.assign({type:'PRESENSIKU_FACE_RESULT'},p),'*');else say('Tab aplikasi utama tidak ditemukan. Buka halaman ini dari tombol aplikasi.','error')}
async function load(){if(ready)return;say('Memuat model wajah...');await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MODEL),faceapi.nets.faceLandmark68Net.loadFromUri(MODEL),faceapi.nets.faceRecognitionNet.loadFromUri(MODEL)]);ready=true}
async function start(){if(busy)return;busy=true;document.getElementById('start').disabled=true;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('API kamera tidak tersedia. Gunakan HTTPS.');await load();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});let v=document.getElementById('video');v.srcObject=stream;await new Promise(r=>{if(v.readyState>=1)r();else v.onloadedmetadata=r});await v.play();await challenge()}catch(e){say((e.name||'Error')+': '+e.message,'error');send({error:(e.name||'Error')+': '+e.message})}finally{busy=false;document.getElementById('start').disabled=false}}
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;document.getElementById('video').srcObject=null;say('Kamera dimatikan.')}
function ear(p){let d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);return(d(p[1],p[5])+d(p[2],p[4]))/(2*d(p[0],p[3]))}
async function detect(desc=false){let r=faceapi.detectSingleFace(document.getElementById('video'),new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.55})).withFaceLandmarks();if(desc)r=r.withFaceDescriptor();return await r}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function challenge(){say('Liveness 1/2: kedipkan mata dua kali...');let n=0,closed=false,end=Date.now()+20000;while(Date.now()<end&&n<2){let d=await detect();if(d){let x=(ear(d.landmarks.getLeftEye())+ear(d.landmarks.getRightEye()))/2;if(x<.19)closed=true;else if(closed){n++;closed=false;say('Kedipan '+n+'/2')}}await wait(180)}if(n<2)throw Error('Dua kedipan tidak terdeteksi.');
say('Liveness 2/2: putar kepala ke kiri lalu kanan...');let l=false,r=false;end=Date.now()+16000;while(Date.now()<end&&!(l&&r)){let d=await detect();if(d){let p=d.landmarks.positions,nose=p[30],le=p[36],re=p[45],mid=(le.x+re.x)/2,span=Math.abs(re.x-le.x),q=(nose.x-mid)/(span||1);if(q<-.16)l=true;if(q>.16)r=true}await wait(180)}if(!l||!r)throw Error('Gerakan kepala kiri/kanan tidak lengkap.');
say('Mengambil template wajah...');let d=await detect(true);if(!d)throw Error('Wajah tidak terdeteksi.');say('Pemeriksaan selesai. Mengirim hasil...','ok');send({descriptor:Array.from(d.descriptor),livenessPassed:true});stop()}
</script></body></html>
